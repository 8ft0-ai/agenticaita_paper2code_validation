name: Check issue hygiene

on:
  workflow_dispatch:

jobs:
  check-hygiene:
    name: Check issue hygiene report
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate hygiene reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p hygiene-output

          python scripts/check_issue_hygiene.py \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 200 \
            --format json \
            --output hygiene-output/issue_hygiene.json

          python scripts/check_issue_hygiene.py \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 200 \
            --format markdown \
            --output hygiene-output/issue_hygiene.md

      - name: Upload hygiene artefact
        uses: actions/upload-artifact@v4
        with:
          name: issue-hygiene-all
          path: |
            hygiene-output/issue_hygiene.md
            hygiene-output/issue_hygiene.json
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          issues_checked="not available"
          issues_with_warnings="not available"
          warning_count="not available"

          if [ -f hygiene-output/issue_hygiene.json ]; then
            issues_checked=$(python -c 'import json; print(json.load(open("hygiene-output/issue_hygiene.json", encoding="utf-8")).get("summary", {}).get("issues_checked", 0))')
            issues_with_warnings=$(python -c 'import json; print(json.load(open("hygiene-output/issue_hygiene.json", encoding="utf-8")).get("summary", {}).get("issues_with_warnings", 0))')
            warning_count=$(python -c 'import json; print(json.load(open("hygiene-output/issue_hygiene.json", encoding="utf-8")).get("summary", {}).get("warnings", 0))')
          fi

          {
            echo "## Issue hygiene report"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Issue state filter: \`all\`"
            echo "- Issue limit: \`200\`"
            echo "- Issues checked: \`$issues_checked\`"
            echo "- Issues with warnings: \`$issues_with_warnings\`"
            echo "- Warning count: \`$warning_count\`"
            echo "- Artefact name: \`issue-hygiene-all\`"
            echo "- Retention: \`14 days\`"
            echo "- Strict mode: \`false\`"
            echo
            echo "Generated reports are uploaded as workflow artefacts only."
            echo "This workflow does not mutate issues, labels, milestones, comments, or repository files."
          } >> "$GITHUB_STEP_SUMMARY"
