name: Patch Submission Envelope Broker

on:
  push:
    branches:
      - patch-submissions
    paths:
      - '.patches/inbox/*.patch-submission'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: patch-submissions
  cancel-in-progress: false

jobs:
  process:
    if: ${{ !contains(github.event.head_commit.message, '[patch-broker:archive]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch submissions branch
        uses: actions/checkout@v4
        with:
          ref: patch-submissions
          fetch-depth: 0
          token: ${{ secrets.PATCH_BOT_TOKEN || github.token }}

      - name: Fetch broker script from main
        env:
          GH_TOKEN: ${{ secrets.PATCH_BOT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patch-submission-broker"
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/${{ github.repository }}/contents/scripts/patch_submission_envelope_broker.py?ref=main" \
            > "$RUNNER_TEMP/patch-submission-broker/patch_submission_envelope_broker.py"
          chmod +x "$RUNNER_TEMP/patch-submission-broker/patch_submission_envelope_broker.py"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Process patch submission envelope
        env:
          GH_TOKEN: ${{ secrets.PATCH_BOT_TOKEN || github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BROKER_REPO: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/patch-submission-broker/patch_submission_envelope_broker.py"
