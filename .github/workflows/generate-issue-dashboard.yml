name: Generate issue dashboard

on:
  workflow_dispatch:

jobs:
  generate-dashboard:
    name: Generate issue dashboard artefact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate dashboard files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dashboard-output

          python scripts/generate_issue_dashboard.py \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 200 \
            --markdown-output dashboard-output/issue_dashboard.md \
            --json-output dashboard-output/issue_dashboard.json

      - name: Upload dashboard artefact
        uses: actions/upload-artifact@v4
        with:
          name: issue-dashboard-open
          path: |
            dashboard-output/issue_dashboard.md
            dashboard-output/issue_dashboard.json
          if-no-files-found: error
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Issue dashboard artefact"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Issue state filter: \`open\`"
            echo "- Issue limit: \`200\`"
            echo "- Artefact name: \`issue-dashboard-open\`"
            echo "- Retention: \`14 days\`"
            echo
            echo "Generated files are uploaded as workflow artefacts only."
            echo "This workflow does not commit \`docs/issue_dashboard.md\`, commit \`docs/issue_dashboard.json\`, mutate issues, or replace \`docs/roadmap.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
